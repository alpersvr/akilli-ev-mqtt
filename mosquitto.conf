# mosquitto.conf
# ------------------------------------------------------------
# Mosquitto configuration file for this project.
# To run it (from the project folder):
#     mosquitto -c mosquitto.conf -v
#
# Without a config file Mosquitto only opens port 1883. The panel in the
# browser, however, speaks MQTT over WebSocket, so we define a second
# "listener".
# ------------------------------------------------------------

# Normal MQTT port for the Python programs
listener 1883 localhost
protocol mqtt

# WebSocket port for the panel in the browser (config.py -> WEBSOCKET_PORT)
listener 9001 localhost
protocol websockets

# Don't limit how many "in-flight" (awaiting acknowledgement) QoS 1/2
# messages a client may have at once. The default is 20.
#
# WHY? The stage 4 experiment uncovered this problem: paho-mqtt 2.1.0
# sends all queued messages at once after a connection drops and is
# re-established, exceeding this limit. The broker rejected the excess
# with "Quota exceeded (0x97)", paho didn't notice the rejection, and
# QoS 2 messages were SILENTLY lost. With the limit removed, QoS 2 works
# as expected: no loss and no duplicates. (Details: README -> Stage 4)
max_inflight_messages 0

# Allow connections without a username/password.
# Because we wrote "localhost", connections are only possible from this
# computer; nobody else on the network can reach the broker.
allow_anonymous true
