# mosquitto.conf
# ------------------------------------------------------------
# Bu projeye özel Mosquitto ayar dosyası.
# Çalıştırmak için (proje klasöründeyken):
#     mosquitto -c mosquitto.conf -v
#
# Ayar dosyası olmadan Mosquitto sadece 1883 portunu açar. Tarayıcıdaki
# panel ise MQTT'yi WebSocket üzerinden konuşur; bu yüzden ikinci bir
# "dinleyici" (listener) tanımlıyoruz.
# ------------------------------------------------------------

# Python programları için normal MQTT portu
listener 1883 localhost
protocol mqtt

# Tarayıcıdaki panel için WebSocket portu (ayarlar.py -> WEBSOCKET_PORTU)
listener 9001 localhost
protocol websockets

# Bir istemcinin aynı anda "yarım kalmış" (onayı beklenen) QoS 1/2 mesaj
# sayısına sınır koyma. Varsayılan 20'dir.
#
# NEDEN? 4. aşamadaki deneyde şu sorun tespit edildi: paho-mqtt 2.1.0,
# bağlantı kopup yeniden kurulunca biriken mesajların hepsini aynı anda
# gönderiyor ve bu sınırı aşıyor. Broker fazlasını "Quota exceeded (0x97)"
# koduyla reddediyor, paho bu reddi fark etmiyor ve QoS 2 mesajları
# SESSİZCE kayboluyordu. Sınırı kaldırınca QoS 2 beklendiği gibi
# kayıpsız ve kopyasız çalışıyor. (Ayrıntı: README -> 4. aşama)
max_inflight_messages 0

# Kullanıcı adı/şifre istemeden bağlantıya izin ver.
# "localhost" yazdığımız için sadece bu bilgisayardan bağlanılabilir;
# yani ağdaki başka biri broker'a erişemez.
allow_anonymous true
